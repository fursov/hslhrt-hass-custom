name: Home Assistant integration tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  home-assistant:
    name: HA Core 2026.10.2 / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ha-tests.txt
      - name: Install Home Assistant integration test dependencies
        run: python -m pip install -r requirements-ha-tests.txt
      - name: Check newest HA / plugin on weekly runs
        if: github.event_name == 'schedule'
        run: python -m pip install --upgrade homeassistant pytest-homeassistant-custom-component
      - name: Validate actual HA imports, flows and entities
        run: python -m pytest -q -p pytest_homeassistant_custom_component tests/integration
