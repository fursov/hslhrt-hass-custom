[tool.ruff]
target-version = "py313"
line-length = 88
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
# Legacy code is moved without functional or stylistic refactoring in PR1.
# Catch syntax, indentation and undefined names now. Expand rules in later PRs.
select = ["E4", "E7", "E9", "F821", "F822", "F823"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
